<!DOCTYPE html>
<html>
<head>
    <title>1019-位置與圖層</title>
    <style>
        /*position: realtive 是相對於自己原本的座標
          position: absolute 是相對於(有設定position的母容器 或 body)的絕對座標
            可設定top/left或bottom/right

            z-index為圖層，數字大的在上；數字相同後生成者在上
          */
        #dad{
            border: 1px solid black;
            width: 300px;
            height: 300px;
            position: relative;/*相對於自己原來位置*/
            top: 20px;
            left: 10px;
        }
        #d1{
            border: 2px solid red;
            width: 100px;
            height: 100px;
            background-color: hsla(0deg, 100%, 50%, 0.5);
            position: relative;
            z-index: 90;
        }
        #d2{
            border: 2px solid blue;
            width: 100px;
            height: 100px;
            position: relative;/*相對自己原來位置*/
            top: 20px;
            left: 20px;
        }
        #d3{
            border: 2px solid green;
            width: 100px;
            height: 100px;
            background-color: hsla(120deg, 100%, 50%, 0.9);
            position: absolute;/*相對於dad的絕對位置*/
            top: 10px;
            left: 10px;
            z-index: 80;
        }
        #d4{
            background-color: hsla(60deg, 100%, 50%, 1);
            width: 100px;
            height: 100px;
            position: absolute;
            right: 10px;
            bottom: 10px;
        }
        #uncle{
            border: 2px dashed black;
            width: 100px;
            height: 100px;
            position: absolute;/*相對於body的絕對位置*/
            z-index: 100;
            top: 50px;
            left: 150px;
        }
    </style>
</head>
<body>
    <div id="dad">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
    <div id="uncle"></div>
</body>
</html>
