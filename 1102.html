<!DOCTYPE html>
<html>
<head>
    <title>1102-JavaScript輸入與輸出</title>
    <style>
        /*css註解*/
        #ans{
            width: 300px;
            height: 100px;
            background-color: gray;
        }
    </style>
    <script>
        /*js:javascript 多行註解*/
        //js單行註解
        function say() {
            name = prompt("請問你的名字?");
            if(confirm("你確定你叫" + name + "嗎?")){
                alert("你好，" + name)
            }else{
                alert("請重新輸入!");
            }
            
            
            
            /*問問題並回答，得到字串的答案
            ans = prompt("你叫什麼名字?");
            console.log(ans + "是" + typeof(ans) + "類型的")
            得到兩種結果:string/null(object)*/
            /*確認是否
            ans = confirm("你確定嗎?");
            console.log(ans + "是" + typeof(ans) + "類型的")
            得到兩種結果:true/false*/
            /*單純輸出
            alert("你好");
            console.log("hello");
            document.getElementById("ans").innerHTML="hello";*/
            document.getElementById("ans").innerHTML="hello";
        }
        function setVol(){
            vol = document.getElementById("vol_range").value;
            document.getElementById("vol_num").innerHTML = vol;
            //document.getElementById("vol_num").innerHTML=document.getElementById("vol_range").value;
        }
        function setBGcolor(){
            document.getElementById("ans").style.backgroundColor = document.getElementById("bgcolor").value;
        }
        function add(){
            n1 = parseInt(document.getElementById("n1").value);
            n2 = parseInt(document.getElementById("n2").value);
            console.log(typeof(n1))
            console.log(typeof(n2))

            document.getElementById("add_ans").innerHTML = (n1 + n2);
        }
        function ready(){
            setVol();
        }
    </script>
</head>
<body onload="">
    <button onclick="say();">打招呼</button>
    <div id="ans"></div>
    <hr>
    <input type="text" value="text"><br>
    <input type="password" value="password"><br>
    <input type="number" value="number"><br>
    <input type="date" value="2026-11-02"><br>
    <input type="datetime-local" value="2026-11-02T08:57:21"><br>
    <input type="color" value="#FF0000" id="bgcolor" oninput="setBGcolor()"><br>
    <input type="range" id="vol_range" min="1" max="100" value="50" oninput="setVol()"><span id="vol_num">50</span>
    <hr>
    <input type="number" id="n1"> + <input type="number" id="n2"> <button onclick="add()">等於</button> <span id="add_ans"></span>
</body>
</html>
