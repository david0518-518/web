<!DOCTYPE html>
<html>
<head>
    <title>1019-變形與轉變、陰影</title>
    <style>
        div{
            width: 100px;
            height: 50px;
            border: 2px solid black;
            margin: 30px;
        }
        #d1{
            transform: rotate(45deg);/*順時針*/
        }
        #d2{
            transform: rotate(-45deg);/*逆時針*/
        }
        #d3{
            transform: scale(0.5,1);/*倍率*/
        }
        #d4{
            transform: translate(50px,20px)/*位移*/;
        }
        #d5{
            transition: transform 2s;
        }
        #d5:hover{
            transform: rotate(45deg) translate(50px);/*先旋轉在位移*/
        }
        #d6{
            transition: transform 2s;
        }
        #d6:hover{
            transform: translate(50px) rotate(45deg);/*先位移在旋轉*/
        }
       
       #d7{
            background-color: yellow;
            transition: background-color 1s,width 2s;
        }
        #d7:hover{
            background-color: red;
            width: 200px;    
        }
        
        #s1{
            box-shadow: 10px 10px black;/*前兩個 x/y位移*/
        }
        #s2{
            box-shadow: 5px 5px 10px black;/*第三個 柔邊程度*/
        }
        #s3{
            box-shadow: 5px 5px 5px 15px red;/*第四個 擴大程度*/
        }
        #s4{
            font-size: 50px;
            text-shadow: 5px 5px 5px red;
        }
        #s5{
            font-size: 50px;
            color: white;
            text-shadow: 0px 0px 10px black;
        }
    </style>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <div id="d7"></div>
    <hr>
    <div id="s1"></div>
    <div id="s2"></div>
    <div id="s3"></div>
    <p id="s4">文字</p>
    <p id="s5">文字</p>
    

</body>
</html>
