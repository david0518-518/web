<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <tytle>1116-JS計時器與亂數</tytle>
    <style>
        .diget{
            font-size: 100pt;
        }
    </style>
    <script>
        var timer_sec=0;/*全域變數*/
        var timer_id=-1;

        function timer_start(){
            timer_id=setInterval(function(){
                timer_sec++;
                if(timer_sec<10){
                //document.getElementById("timer").innerHTML="0"+timer_sec;
                document.getElementById("timer").innerHTML=`0${timer_sec}`;
                
                }else{
                document.getElementById("timer").innerHTML=timer_sec;
                }
            },1000);
            
        }
        function timer_stop(){
            if(timer_id<0)return;
            clearInterval(timer_id);
            timer_id=-1;
        }
        function timer_reset(){
            timer_stop();
            document.getElementById("timer").innerHTML="00";
            timer_sec=0;
        }
        //----------------------------------------------------------------
        function getRandom(min,max){
            return Math.floor(Math.random()*(max-min+1)) + min;
        }
        function getlottery(){
            
            setTimeout(clearInterval,1000,setInterval(()=>{
                var x=getRandom(0,99);
                document.getElementById("lottery").innerHTML=((x<10)?"0":"")+x;
            },100));
            
        }
        //-----------------------------------------------------------------------
        function getdice(){
            setTimeout(clearInterval,1000,
                setInterval((img)=>{
                    img.src=`pic/dice${getRandom(1,6)}.png`;
                },100,event.target)
            );            
        }
    </script>
</head>
<body>
    <div id="timer" class="diget">00</div>
    <button onclick="timer_start()">開始</button>
    <button onclick="timer_stop()">暫停</button>
    <button onclick="timer_reset()">重設</button>
    <hr>
    <div id="lottery" class="diget">00</div>
    <button onclick="getlottery()">樂透</button>
    <hr>
    <img src="pic/dice0.png" width="100px" onclick="getdice()">
</body>
</html>
